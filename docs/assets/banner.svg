<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Over Strudel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- staff lines -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5">
    <line x1="0" y1="96" x2="1280" y2="96"/><line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="192" x2="1280" y2="192"/>
    <line x1="0" y1="224" x2="1280" y2="224"/>
  </g>
  <rect x="320" y="299" width="640" height="2" fill="url(#glow)"/>
  <!-- mark -->
  <g transform="translate(336 92) scale(3.4)" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="24" cy="24" r="21" stroke-width="1.5" opacity="0.9"/>
    <path d="M9.5 28.5 C 15 28.5, 16 19.5, 22 19.5 C 28 19.5, 28 28.5, 33 28.5" stroke-width="1.8"/>
    <circle cx="37.5" cy="28.5" r="2.4" fill="#fff" stroke="none"/>
  </g>
  <!-- wordmark -->
  <text x="530" y="176" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" letter-spacing="2" fill="#ffffff">
    <tspan font-weight="700">Over</tspan><tspan dx="16" font-weight="300" fill="#a1a1aa">Strudel</tspan>
  </text>
  <text x="532" y="222" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="1.2" fill="#9ca3af">Live-code music. Watch it become sheet music.</text>
</svg>
