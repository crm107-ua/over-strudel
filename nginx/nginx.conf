server {
  listen 80;
  server_name _;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             image/svg+xml application/wasm font/woff2;

  # Hashed build assets (JS chunks, Web Worker chunk, CSS, fonts): cache aggressively.
  location /_next/static/ {
    proxy_pass http://app:3000;
    proxy_hide_header Cache-Control; # Next sends its own: keep a single, explicit policy
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# TLS (443): mount certs and add a second server block, or terminate TLS in Caddy/Traefik/Proxmox LB.
# Brotli needs the ngx_brotli module (e.g. image fholzer/nginx-brotli); stock nginx:alpine only has gzip.
